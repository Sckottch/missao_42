<!DOCTYPE html>
<html>
	<head>
		<title>Tabela</title>
	</head>

	<style>
		table, th, td {
			border:2px solid black;
		}

		html, body {
			padding: 0;
			margin: 0;
		}

		table {
			width: 100%;
			height: 100vh;
			table-layout: fixed;
			border-collapse: collapse;
		}

		td {
			height: 100%;
			width: 50%;
			font-size: 24px;
		}

		td:nth-child(odd) {
			background-color: blue;
		}

		td:nth-child(even) {
			background-color: red;
		}
	</style>

	<body>
		<table>
			<tr>
				<td>Azul</td>
				<td>Vermelho</td>
			</tr>
		</table>
	</body>
</html>
