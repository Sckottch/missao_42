<!DOCTYPE html>
<html>
	<head>
		<title>Tabela</title>
	</head>

	<style>
		table, th, td {
			border:1px solid black;
		}

		td {
			font-size: 23px;
		}

		td:nth-child(odd) {
			background-color: blue;
		}

		td:nth-child(even) {
			background-color: red;
		}
	</style>

	<body>
		<table>
			<tr>
				<td>Azul</td>
				<td>Vermelho</td>
			</tr>
		</table>
	</body>
</html>
