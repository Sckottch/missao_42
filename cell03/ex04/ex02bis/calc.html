<!DOCTYPE html>
<html>
	<head>
		<title>Calculadora</title>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	</head>

	<style>

	body {
		height: 100vh;
		background-color: lightslategray;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.calc-container {
		display: flex;
		gap: 4px;
		flex-direction: column;
		justify-content: center;
		align-items: center;
	}

	.calc-output {
		border: 1px slategrey solid;
		background-color: white;
		border-radius: 8px;
		width: 480px;
		text-align: right;
		padding: 4px;
	}

	.popup {
		visibility: hidden;
		position: fixed;
		background-color: slategray;
		width: 200px;
		padding: 8px;
		text-align: center;
		font-size: 24px;
		border-radius: 8px;
		border: 2px solid black;
	}

	</style>

	<body>
		<div class="calc-container">
			<div class="calc-output">
				<p id="calc_output">0</p>
			</div>
			<div class="operation-container">
				<input id="calc_input_1" class="calc-input" type="number">
				<select name="operator" id="operator_dropdown">
					<option value="+">+</option>
					<option value="-">-</option>
					<option value="*">*</option>
					<option value="/">/</option>
					<option value="%">%</option>
				</select>
				<input id="calc_input_2" class="calc-input" type="number">
				<button id="calc_btn">Try me!</button>
			</div>
		</div>

		<script>

		$(function () {
			const $output = $("#calc_output");
			const $input1 = $("#calc_input_1");
			const $input2 = $("#calc_input_2");
			const $operator = $("#operator_dropdown");
			const $button = $("#calc_btn");

			let inactivityTimeout;

			function resetTimeout() {
				clearTimeout(inactivityTimeout);
				inactivityTimeout = setTimeout(showAlert, 30000);
			}

			function showAlert() {
				alert("Please use me...");
			}

			function sendMessage(message) {
				console.log(message);
				$output.html(message);
				alert(message);
			}

			$button.on("click", function() {
				let num1 = $input1.val().trim();
				let num2 = $input2.val().trim();
				let result;

				if (num1 === "" || !/^-?\d+$/.test(num1)) {
					sendMessage("Error :(")
					return;
				}

				if (num2 === "" || !/^-?\d+$/.test(num2)) {
					sendMessage("Error :(")
					return;
				}

				num1 = Number(num1);
				num2 = Number(num2);

				if (num1 < 0 || num2 < 0) {
					sendMessage("Error :(")
					return;
				}

				switch($operator.val()) {
					case "+":
						result = num1 + num2;
						break;

					case "-":
						result = num1 - num2;
						break;

					case "*":
						result = num1 * num2;
						break;

					case "/":
						if (num2 === 0) {
							sendMessage("It's over 9000!")
							return;
						}
						result = num1 / num2;
						break;

					case "%":
						if (num2 === 0) {
							sendMessage("It's over 9000!")
							return;
						}
						result = num1 % num2;
						break;
				}

				sendMessage(result);
			});

			resetTimeout();
		});

		</script>
	</body>
</html>
