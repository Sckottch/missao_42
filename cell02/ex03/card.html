<!DOCTYPE html>
<html>
	<head>
		<title>Profile Card</title>
		<link rel="stylesheet" href="./card.css">
	</head>

	<body>
		<h1>User Profile Card</h1>
		<table class="card-table">
			<tr>
				<th class="card-th">
					<img class="pfp" src="./pfp.jpg" alt="">
					<h2>rescote</h2>
				</th>
			</tr>
			<tr>
				<td>
					<p class="card-info">Game Developer</p>
				</td>
			</tr>
			<tr>
				<td class="card-location">42 São Paulo</td>
			</tr>
			<tr>
				<td>
					<img class="card-social" src="./icons/whatsapp.svg" alt="">
					<img class="card-social" src="./icons/linkedin.svg" alt="">
					<img class="card-social" src="./icons/github.svg" alt="">
				</td>
			</tr>
			<tr>
				<td>
					<button class="card-button">
						Contact
					</button>
				</td>
			</tr>
		</table>
	</body>
</html>
